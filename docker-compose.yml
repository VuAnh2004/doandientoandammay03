services:
  # Xóa sqlserver container vì giờ dùng RDS
  webdt3:
    image: vuanh2004/webdt3:final
    container_name: webdt3
    restart: always
    ports:
      - "9000:5254"
    environment:
      ASPNETCORE_URLS: "http://+:5254"
      ConnectionStrings__DefaultConnection: "Server=${RDS_ENDPOINT};Database=QLTH;User Id=admin;Password=Anh@12345;TrustServerCertificate=True"
    networks:
      - webdt3-network

networks:
  webdt3-network:
    driver: bridge